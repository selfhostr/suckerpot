name: Trap packs

# Signs and publishes the trap pack bundle (M37, docs/trap-packs.md).
#
# 1. build (no secret): on a push to main that touches traps/, or a manual run on main. It
#    validates every pack (the same checks as CI), then writes traps.json with a new seq (the
#    current Unix time, refused unless above the published one) and the kill list
#    traps/disabled.yaml.
# 2. publish: runs in the protected GitHub environment "trap-packs", whose required reviewer is
#    the owner. The pack secret key is a secret of that environment only (TRAP_PACK_SECRET_KEY,
#    the minisign secret key file). The bundle is signed, verified against the public key
#    committed in config/network-defaults.env, and attached to the fixed release "trap-packs".
#    The hub relays it unchanged to the feed site; every node verifies it again.
#
# Never runs on pull requests: no secret is ever exposed to code that was not merged.

on:
  push:
    branches: [main]
    paths: ["traps/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: trap-packs
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Fetch the bundle published now (if any)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p previous
          code=$(curl -sS -L -o previous/traps.json -w '%{http_code}' --max-filesize 1048576 \
            "https://github.com/$REPO/releases/download/trap-packs/traps.json" || true)
          case $code in
            200) echo "a bundle is published" ;;
            404) rm -f previous/traps.json; echo "no bundle published yet" ;;
            *) echo "could not read the published bundle (HTTP $code)" >&2; exit 1 ;;
          esac
      - name: Check the packs and write traps.json
        working-directory: ingest
        run: |
          set -eu
          uv sync -q --frozen
          uv run python -m tools.trap_packs check
          uv run python -m tools.trap_packs release --seq "$(date -u +%s)" \
            --previous ../previous/traps.json --out ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trap-bundle
          path: dist/traps.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: trap-packs
    timeout-minutes: 10
    permissions:
      contents: write # create the fixed release and upload two assets, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trap-bundle
          path: dist
      - name: Sign and verify with the committed public key
        working-directory: ingest
        env:
          TRAP_PACK_SECRET_KEY: ${{ secrets.TRAP_PACK_SECRET_KEY }}
        run: |
          set -eu
          uv sync -q --frozen
          uv run python -m tools.trap_packs sign ../dist/traps.json
      - name: Attach to the release trap-packs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          gh release view trap-packs --repo "$REPO" > /dev/null 2>&1 \
            || gh release create trap-packs --repo "$REPO" --target "$SHA" --latest=false \
              --title "Trap packs" --notes "Signed trap pack bundle (docs/trap-packs.md). Not a software release."
          # The signature last: a reader that sees the new signature also finds the new bundle.
          gh release upload trap-packs --repo "$REPO" --clobber dist/traps.json
          gh release upload trap-packs --repo "$REPO" --clobber dist/traps.json.minisig
