name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Python dependencies (uv.lock)
        run: |
          set -euo pipefail
          allowed="MIT;Apache;BSD;ISC;MPL;Mozilla Public;SIL Open Font;OFL;CC0;Unlicense;0BSD;Zlib;BSL-1.0;Boost;Python Software Foundation;PSF;HPND;LGPL;GPL;AGPL;Public Domain"
          uv venv "$RUNNER_TEMP/tool" >/dev/null
          uv pip install --python "$RUNNER_TEMP/tool/bin/python" pip-licenses >/dev/null
          status=0
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::$dir"
            uv export --frozen --no-hashes --no-emit-project --no-emit-workspace --no-emit-local --project "$dir" -o "$RUNNER_TEMP/req.txt" >/dev/null
            rm -rf "$RUNNER_TEMP/venv"
            uv venv "$RUNNER_TEMP/venv" >/dev/null
            uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-deps -r "$RUNNER_TEMP/req.txt" >/dev/null
            "$RUNNER_TEMP/tool/bin/pip-licenses" --python "$RUNNER_TEMP/venv/bin/python" --partial-match --allow-only="$allowed" --format=plain || status=1
            echo "::endgroup::"
          done < <(git ls-files '*uv.lock')
          exit "$status"
      - name: Web dependencies (pnpm)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run licences

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same minor as the service images; uv would otherwise pick the newest Python.
          python-version: "3.15"
      - name: Lint, type-check and test each package
        run: |
          set -euo pipefail
          found=0
          for dir in sensors/common sensors/ssh sensors/rdp sensors/web sensors/telnet sensors/redis sensors/docker sensors/mysql sensors/mssql sensors/adb sensors/smb sensors/sip sensors/synology scripts/demo scripts/guardrails egress analysis reporting netproto collector hubproxy db ingest api hub; do
            if [ -f "$dir/pyproject.toml" ]; then
              found=1
              echo "::group::$dir"
              (
                cd "$dir"
                uv sync
                uv run ruff check
                uv run ruff format --check
                uv run mypy .
                uv run pytest -m 'not integration'
              )
              echo "::endgroup::"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No Python packages found yet; nothing to check."
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build

  python-integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
        env:
          POSTGRES_DB: suckerpot_test
          POSTGRES_USER: suckerpot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suckerpot -d suckerpot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.3-alpine3.23@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: suckerpot_test
      POSTGRES_USER: suckerpot
      POSTGRES_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      POSTGRES_INGEST_USER: suckerpot_ingest
      POSTGRES_INGEST_PASSWORD: ci-only-ingest-password
      POSTGRES_API_USER: suckerpot_api
      POSTGRES_API_PASSWORD: ci-only-api-password
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: "1"
      DB_DIR: ${{ github.workspace }}/db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same minor as the service images; uv would otherwise pick the newest Python.
          python-version: "3.15"
      - name: Migrate the test database
        working-directory: db
        run: |
          uv sync
          # Same path as the production migrate container.
          uv run python -m suckerpot_db.entrypoint alembic upgrade head
      - name: Run integration tests
        run: |
          set -euo pipefail
          for dir in db ingest api collector; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "::group::$dir"
              (
                cd "$dir"
                uv sync
                # Exit code 5 means "no integration tests collected", which is fine.
                rc=0
                uv run pytest -m integration || rc=$?
                if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
              )
              echo "::endgroup::"
            fi
          done

  # The hub is a separate deployable: its API, worker, privacy and end-to-end tests run against a
  # throwaway PostgreSQL (the schema is rebuilt at the start of the run).
  hub-integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: hub_test
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HUB_TEST_DATABASE_URL: postgresql+asyncpg://hub:ci-only-password@127.0.0.1:5432/hub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Hub integration and end-to-end tests
        working-directory: hub
        run: |
          uv sync
          uv run pytest -m integration

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare .env
        run: |
          cp .env.example .env
          # Never the live project name on a test stack.
          sed -i '/^COMPOSE_PROJECT_NAME=/d;/^SUCKERPOT_VOLUME_PREFIX=/d' .env
          {
            echo "COMPOSE_PROJECT_NAME=sp-ci"
            echo "SUCKERPOT_VOLUME_PREFIX=sp-ci"
            # CI only: allow the "change-me" placeholder secrets.
            echo "SUCKERPOT_ALLOW_DEFAULT_SECRETS=1"
            # The runner's own sshd already uses port 22.
            echo "SSH_HOST_PORT=2222"
            # Demo and test traffic uses synthetic addresses.
            echo "GEOIP_FAKE_FOR_PRIVATE=true"
            # Required settings; authentication is switched off by docker-compose.ci.yml.
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml"
            echo "ADMIN_PASSWORD_HASH=ci-placeholder"
            echo "SESSION_SECRET=ci-placeholder-session-secret-not-used"
          } >> .env
      - name: Check the port layout
        run: scripts/check-ports.sh
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300
      - name: Check the API health endpoint
        run: curl -fsS http://127.0.0.1:8443/healthz
      - name: Check that the SSH sensor is healthy
        run: |
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q sensor-ssh)")
          echo "sensor-ssh: $status"
          test "$status" = healthy
      - name: Check that the RDP sensor is healthy
        run: |
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q sensor-rdp)")
          echo "sensor-rdp: $status"
          test "$status" = healthy
      - name: Check that the web sensor is healthy
        run: |
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q sensor-web)")
          echo "sensor-web: $status"
          test "$status" = healthy
      - name: HTTP requests against the web sensor
        run: scripts/web-test.sh
      - name: Check that the Telnet sensor is healthy
        run: |
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q sensor-telnet)")
          echo "sensor-telnet: $status"
          test "$status" = healthy
      - name: Telnet login and fake download against the sensor
        run: scripts/telnet-test.sh
      - name: RDP connection request against the sensor
        run: scripts/rdp-test.sh
      - name: Check that the new sensors are healthy
        run: |
          for s in redis docker mysql mssql adb smb sip synology; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "sensor-$s")")
            echo "sensor-$s: $status"
            test "$status" = healthy
          done
      - name: Real SSH login against the sensor
        env:
          SSH_HOST_PORT: "2222"
        run: scripts/ssh-test.sh
      - name: Generate demo data
        run: docker compose --profile tools run --rm demo --sessions 50 --days 2
      - name: Wait until ingest has stored sessions
        run: |
          for _ in $(seq 1 30); do
            body=$(curl -fsS "http://127.0.0.1:8443/api/v1/sessions?limit=5" || true)
            if echo "$body" | grep -q '"session_id"'; then
              echo "Sessions are visible through the API."
              curl -fsS http://127.0.0.1:8443/api/v1/stats/summary
              exit 0
            fi
            sleep 2
          done
          echo "No session appeared within 60 seconds." >&2
          exit 1
      - name: Switch two sensors off (SENSOR_TELNET=0, SENSOR_SIP=0)
        run: |
          printf 'SENSOR_TELNET=0\nSENSOR_SIP=0\n' >> .env
          scripts/check-ports.sh
          docker compose up -d --no-build --wait --wait-timeout 300
          # replicas 0: no container at all (not even a stopped one) and nothing listening.
          test -z "$(docker compose ps -aq sensor-telnet sensor-sip)"
          if ss -Hltun | grep -Eq ':(23|5060)\s'; then echo "a switched-off sensor still listens" >&2; exit 1; fi
          for s in ssh rdp web redis docker mysql mssql adb smb synology; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "sensor-$s")")
            echo "sensor-$s: $status"
            test "$status" = healthy
          done
          curl -fsS http://127.0.0.1:8443/healthz
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Participant install, end to end (docs/design/m32.md section 11.3): the real installer in a
  # temporary copy, a throwaway test hub with TLS from its own CA, containment checks, enrolment, an
  # accepted batch, leave, and the switch to full mode. Hermetic: unique compose project, local
  # volumes, internal networks only; the real hub is never contacted. Image pulls and the base images
  # of the builds are the only traffic to the internet.
  participant-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The installer refuses to run with less than 15 GiB free under Docker's data folder, and
      # some hosted runners start just below that. Remove preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / /var/lib/docker
      - name: Participant end-to-end test
        run: scripts/e2e/participant.sh
