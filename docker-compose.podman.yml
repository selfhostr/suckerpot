# Podman overlay (docs/dev/design/podman.md, section 5.2). Added to COMPOSE_FILE on Podman only,
# never on Docker:
#
#   COMPOSE_FILE=docker-compose.yml[:docker-compose.lowmem.yml][:docker-compose.participant.yml]:docker-compose.podman.yml
#
# 1. Networks. Podman's Docker-compatible API ignores enable_ip_masquerade, enable_icc and
#    gateway_mode_ipv4. So on Podman scripts/ensure-networks.sh creates every sp-* network with
#    netavark's own options (isolate=strict, --internal, --disable-dns), and this file marks them
#    external: compose uses them and never creates or removes a network. The host firewall
#    (scripts/host/, mandatory on Podman) adds the rest.
# 2. Third-party images with their registry (5.9). Same image, same digest as docker-compose.yml.
#    Only here, so that a Docker node keeps the exact service definition (a changed image string
#    would recreate the containers at the next update).
# 3. Bind mounts of repository files get the SELinux option `z` (5.11): Fedora and the RHEL family
#    deny a container access to an unlabelled host file. No effect without SELinux.
# 4. tmpfs mounts owned by the service's user: Podman refuses the uid= and gid= options (checked
#    on Podman 5.4 and 5.8), so they become Podman's own option U, which gives the mount to the
#    container's user. Every such service runs as that same uid:gid (the guardrail checks it).
#    `!override` replaces the list: the base list would otherwise be kept next to it.
# 5. backup's healthcheck without start_interval, which docker-compose refuses on Podman 5.4
#    (Docker API 1.41), and with a 1 minute interval instead.
# 6. /run and /var/tmp as small noexec tmpfs mounts in every service. With read_only, Podman adds
#    its own writable /run and /var/tmp (read-only-tmpfs), without noexec and without a size
#    limit: a compromised sensor could write a program there and run it. Docker adds neither.
# 7. Logs go to journald (design D7). Podman keeps json-file's max-size but ignores max-file:
#    checked on Podman 5.4, a log past 10 MB is cut and restarted in one file. journald's own size
#    and rate limits then apply.
#
# Nothing else. scripts/guardrails/tests/test_podman.py fails if this file changes anything else.

services:
  redis:
    logging:
      driver: journald
      options: !reset {}
    tmpfs: !override
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=0700,U
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /var/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
  db:
    image: docker.io/timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    logging:
      driver: journald
      options: !reset {}
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,nodev,size=64m,U
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,U
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /var/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
  migrate:
    logging:
      driver: journald
      options: !reset {}
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,nodev,size=16m,U
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /var/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
  backup:
    image: docker.io/timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    volumes:
      - ./scripts/backup-service.sh:/backup-service.sh:ro,z
    # Podman 5.4 announces Docker API 1.41, and docker-compose refuses start_interval below 1.44.
    # Without it, a 1 minute interval keeps the first `up --wait` short.
    healthcheck:
      interval: 1m
      start_interval: !reset null
    logging:
      driver: journald
      options: !reset {}
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,nodev,size=8m,U
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /var/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
  ingest:
    logging:
      driver: journald
      options: !reset {}
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,nodev,size=16m,U
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /var/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
  api:
