# Every network of docker-compose.yml, external, under its bridge name. The Docker options are
# reset: they mean nothing to a network compose does not create.
networks:
  ingress: &external
    external: true
    name: sp-ingress
    driver_opts: !reset {}
    internal: !reset null
    enable_ipv6: !reset null
  dashboard:
    <<: *external
    name: sp-dashboard
  vpn-uplink:
    <<: *external
    name: sp-vpn
  hub-uplink:
    <<: *external
    name: sp-hubgate
  egress-proxy:
    <<: *external
    name: sp-egress
  hub-proxy:
    <<: *external
    name: sp-hubproxy
  samples:
    <<: *external
    name: sp-samples
  backend:
    <<: *external
    name: sp-backend
  tools:
    <<: *external
    name: sp-tools
  sensors-ssh:
    <<: *external
    name: sp-s-ssh
  sensors-rdp:
    <<: *external
    name: sp-s-rdp
  sensors-telnet:
    <<: *external
    name: sp-s-telnet
  sensors-web:
    <<: *external
    name: sp-s-web
  sensors-redis:
    <<: *external
    name: sp-s-redis
  sensors-docker:
    <<: *external
    name: sp-s-docker
  sensors-mysql:
    <<: *external
