# Gitleaks configuration for SuckerPot (public repo: no secrets, real addresses or captured data).
# Extends the default ruleset and adds a rule for private IPv4 addresses.

title = "SuckerPot gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address (192.168.0.0/16, 10.0.0.0/8 or 172.16.0.0/12): the owner's network layout must not be published"
# Octet = 0-255. The leading guard skips values glued to other digits or dots
# (e.g. version strings like 1.10.0.1); the trailing guard skips a fifth dotted
# number (e.g. 10.0.0.1.2).
regex = '''(?:^|[^\d.\w-])((?:192\.168|10\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|172\.(?:1[6-9]|2\d|3[01]))\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d))(?:$|[^\d]|\.(?:[^\d]|$))'''
secretGroup = 1
keywords = ["192.168.", "10.", "172."]
tags = ["network", "privacy"]

  [[rules.allowlists]]
  description = "Placeholders and the config itself"
  condition = "OR"
  paths = [
    '''(^|/)\.gitleaks\.toml$''',
  ]
  # Documentation ranges (RFC 5737) are not private, so they never match above;
  # this entry only documents the intent and covers obvious placeholders.
  regexes = [
    '''^(192\.0\.2|198\.51\.100|203\.0\.113)\.''',
  ]

# Fixed test keys of the spn/1 golden vectors (netproto/tests/vectors.json). They are public by
# design and used nowhere else.
[[allowlists]]
description = "spn/1 golden test vectors"
paths = ['''^netproto/tests/vectors\.json$''']

# The network defaults hold the project hub's public signing key and the feed's minisign public
# key. They are public by design (nodes pin them); no secret key ever lives in these files.
[[allowlists]]
description = "Public hub and feed keys in the committed network defaults"
paths = [
  '''^config/network-defaults\.env$''',
  '''^netproto/suckerpot_netproto/data/network_defaults\.env$''',
]

# Container image references such as `valkey/valkey:9.1-alpine3.24` trip generic-api-key (the word
# "key" in the repository name next to a tag). They are public image names, not secrets.
[[allowlists]]
description = "valkey/valkey image references"
regexes = ['''valkey/valkey:[0-9][0-9A-Za-z.\-]*''']
