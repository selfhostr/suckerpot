# Replies: the provider says it will not or cannot act.
# A desk that wants its web form instead of mail is in 32-forms.yaml.
rules:
  - id: not-our-customer
    outcome: rejected
    priority: 30
    description: The provider says the address is not theirs. Runs before the web form rules.
    when:
      field: body
      contains_any: ["not our customer", "not within our network", "does not belong to",
                     "we do not host", "not hosted by", "please contact the",
                     "outside our jurisdiction", "contact the hosting provider",
                     "to the hosting provider", "we are only the registrar",
                     "we are the registrar", "we are just the registrar",
                     "we are the domain registrar", "only the domain registrar"]
  - id: insufficient-evidence
    outcome: rejected
    priority: 31
    description: The provider says the report is not enough to act on.
    when:
      field: body
      contains_any: ["insufficient evidence", "unable to act"]
