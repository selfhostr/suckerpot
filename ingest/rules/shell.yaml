# Rules for interactive sessions (SSH and Telnet commands).
#
# Evidence rule: a malware family name (mirai, crypto-miner) needs an indicator specific to that
# family. Generic download-and-run one-liners are exec-attempt / malware-drop, not a family. On a
# list field, ``has`` means ANY value and ``has_all`` means EVERY value.
rules:
  - id: recon-commands
    tag: recon
    description: >-
      System fingerprinting commands run right after login, including the Android ones
      (getprop reads the device model and CPU, screencap grabs the screen) on the ADB sensor.
    when:
      all:
        - {field: type, equals: command}
        - any:
            - field: data.input
              command_any: [uname, nproc, free, lscpu, whoami, id, w, uptime, hostname, ifconfig, lsb_release, arch, getconf, dmidecode, getprop, screencap]
            - field: data.input
              contains_any: [/proc/cpuinfo, /proc/meminfo, /proc/version, /etc/os-release, /etc/issue, /etc/passwd]

  - id: iot-shell-probe
    tag: iot-shell-probe
    description: >-
      The opening moves of a botnet loader on a Telnet device shell: the shell-escape words
      (enable, system, shell, linuxshell, sh, ping; sh), a BusyBox applet probe (/bin/busybox
      followed by any word, to see which applets exist) and the architecture check
      (cat /proc/self/exe). It names no malware family: many loaders send the same sequence, and
      a known Mirai variant token is tagged mirai on top. BusyBox lines that download or make a
      file executable are tagged by the rules for those steps, not by this one.
    when:
      all:
        - {field: type, equals: command}
        - {field: sensor, equals: telnet}
        - any:
            - {field: data.input, in: [enable, system, shell, linuxshell, sh, "ping; sh", "ping;sh", "ping ;sh", "ping ; sh"]}
            - {field: data.input, contains: /proc/self/exe}
            - all:
                - {field: data.input, command_any: [busybox]}
                - not: {field: data.input, contains_any: [wget, tftp, ftpget, curl, "://", chmod]}

  - id: mirai-busybox
    tag: mirai
    description: >-
      The Mirai-family BusyBox applet probe: the echo-check with a known variant token
      (/bin/busybox ECCHI and friends), or a Mirai binary name. Plain busybox use, wget through
      busybox and /dev/watchdog access are generic and not tagged.
    when:
      all:
        - {field: type, equals: command}
        - field: data.input
          contains_any: [busybox ecchi, busybox mirai, busybox zorro, busybox komashi, busybox josho, busybox sora, busybox owari, busybox komodo, mirai.arm, mirai.mips, mirai.mpsl, mirai.x86]

  - id: crypto-miner
    tag: crypto-miner
    description: Miner binaries, stratum URLs and pool names in commands or download URLs.
    when:
      any:
        - field: data.input
          contains_any: &miner_words [xmrig, minerd, cpuminer, stratum+tcp, stratum+ssl, stratum2+tcp, --donate-level, nicehash, minexmr, supportxmr, nanopool, hashvault, moneroocean, 2miners, ethminer, kdevtmpfsi, kinsing, c3pool]
        - {field: data.command, contains_any: *miner_words}
        - {field: data.url, contains_any: *miner_words}

  - id: exec-attempt
    tag: exec-attempt
    description: Making a file executable or piping a download into a shell.
    when:
      all:
        - {field: type, equals: command}
        - any:
            - all:
                - {field: data.input, command_any: [chmod]}
                - {field: data.input, contains_any: ["+x", "777", "755", "775", "700"]}
            - {field: data.input, startswith: ["./", "sh ./", "bash ./", "nohup ./"]}
            - {field: data.input, contains_any: ["| sh", "|sh", "| bash", "|bash", "|/bin/sh"]}

  - id: persistence
    tag: persistence
    description: >-
      Attempts to survive a reboot or keep access: a write to a startup or key file, a crontab
      piped or loaded from a file, enabling a service. Reading those files (cat, crontab -l) is
      recon, not persistence.
    when:
      all:
        - {field: type, equals: command}
        - any:
            # A redirection counts only when the target comes AFTER the `>` (so `cat authorized_keys
            # 2>/dev/null` does not), or the command is a writer aimed at the file.
            - field: data.input
              glob: ["*>*authorized_keys*", "*>*/etc/cron*", "*>*rc.local*", "*>*.bashrc*", "*>*/etc/init.d*", "*>*/etc/profile.d*"]
            - all:
                - field: data.input
                  contains_any: [authorized_keys, /etc/cron, rc.local, .bashrc, /etc/init.d, /etc/profile.d]
                - field: data.input
                  contains_any: ["tee ", "cp ", "mv ", "ln -s", "sed -i", "install "]
            - field: data.input
              contains_any: ["| crontab", "|crontab", "crontab /", "crontab -e", "systemctl enable", chattr]
